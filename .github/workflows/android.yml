# بناء تطبيق الأندرويد (APK) على خوادم GitHub — بدون حساب EAS
name: Android APK

# ما يبني تلقائياً مع كل رفع — البناء بس لما ينطلب (تشغيل يدوي) أو مع وسم إصدار v*
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'انشر كإصدار (يظهر كتحديث بالتطبيق) — الوسم يكون v + رقم الإصدار من app.json'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      # اختياري: أضفهما في Settings → Secrets → Actions لربط التطبيق بـ Supabase
      # بدونهما يعمل التطبيق بالوضع التجريبي
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: التأكد إن الوسم يطابق رقم الإصدار
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::الوسم ${GITHUB_REF_NAME} ما يطابق الإصدار v${VERSION} في app.json — غيّر version أول"
            exit 1
          fi

      - name: تثبيت المكتبات
        run: npm ci

      - name: فحص الأنواع والتنسيق والاختبارات
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: ملف Firebase للإشعارات (اختياري — من سر GOOGLE_SERVICES_JSON)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
            echo "إشعارات الخادم: مفعّلة"
          else
            echo "::warning::ماكو GOOGLE_SERVICES_JSON — إشعارات الخادم ما تشتغل بهاي النسخة (التذكيرات المحلية تشتغل)"
          fi

      - name: توليد مشروع الأندرويد
        run: npx expo prebuild --platform android --no-install

      - name: مفتاح التوقيع الخاص (من أسرار المستودع)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/balmalaab-release.keystore
            {
              echo "ORG_GRADLE_PROJECT_BALMALAAB_STORE_FILE=balmalaab-release.keystore"
              echo "ORG_GRADLE_PROJECT_BALMALAAB_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ORG_GRADLE_PROJECT_BALMALAAB_KEY_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ORG_GRADLE_PROJECT_BALMALAAB_KEY_ALIAS=balmalaab"
            } >> "$GITHUB_ENV"
            echo "التوقيع: المفتاح الخاص"
          else
            echo "::warning::ماكو مفتاح خاص بالأسرار — النسخة راح تتوقع بالمفتاح التجريبي العام"
          fi

      - name: بناء APK
        working-directory: apps/mobile/android
        # بس معالجات التلفونات (ARM) — بدون نسخ المحاكي x86، حتى الملف يصير تقريباً نص الحجم
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: تسمية الملف
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/balmalaab-${GITHUB_SHA::7}.apk"

      - name: رفع الـ APK
        uses: actions/upload-artifact@v7
        with:
          name: balmalaab-android
          path: apps/mobile/out/*.apk
          retention-days: 30

      - name: رقم الإصدار
        id: ver
        run: echo "tag=v$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      - name: نشر إصدار (عند وسم v* أو تشغيل يدوي مع «انشر كإصدار»)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: بالملعب ${{ steps.ver.outputs.tag }}
          files: apps/mobile/out/*.apk
          prerelease: true
          # التطبيق يقرا هذا النص بصفحة «حول ← شنو الجديد»
          generate_release_notes: true
